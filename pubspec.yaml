name: notenest
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.1+5

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: 0.20.2
  fl_chart: ^1.2.0
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  font_awesome_flutter: ^11.0.0
  http: ^1.2.0
  geolocator: ^12.0.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/presets/
    - assets/icon/

# fonts
  fonts:
  - family: Inter
    fonts:
      - asset: assets/fonts/Inter_28pt-Regular.ttf
      - asset: assets/fonts/Inter_28pt-Medium.ttf
        weight: 500
      - asset: assets/fonts/Inter_28pt-Bold.ttf
        weight: 700

  - family: DMSerifDisplay
    fonts:
      - asset: assets/fonts/DMSerifDisplay-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icon/icon.png"